name: Build Tamam iOS (.ipa) & Android (.apk)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & sync Capacitor iOS
        run: |
          npm install
          npm run sync:www
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
          if [ ! -f "ios/App/App.xcworkspace/contents.xcworkspacedata" ]; then
            (cd ios/App && pod install)
          fi

      - name: Build unsigned iOS App via xcodebuild
        run: |
          if [ -f "ios/App/App.xcworkspace/contents.xcworkspacedata" ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM=""
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM=""
          fi

      - name: Package Payload/App.app into Tamam-unsigned.ipa
        run: |
          APP_PATH=$(find build -name "App.app" -path "*Release-iphoneos*" | head -n 1)
          echo "Found App.app at: $APP_PATH"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app not found under build/*Release-iphoneos*"
            exit 1
          fi
          rm -rf Payload Tamam-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/App.app
          zip -qry Tamam-unsigned.ipa Payload
          ls -lh Tamam-unsigned.ipa

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: |
            Tamam-unsigned.ipa
            Tamam.mobileconfig
            manifest.plist

  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & sync Capacitor Android
        run: |
          npm install
          npm run sync:www
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Tamam.apk
          ls -lh ../Tamam.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: Tamam.apk

  publish-release:
    name: Publish GitHub Release (v1.0.0 / latest)
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-artifacts

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.0.0 Tamam-unsigned.ipa Tamam.apk Tamam.mobileconfig manifest.plist --clobber -R "${{ github.repository }}"
          else
            gh release create v1.0.0 Tamam-unsigned.ipa Tamam.apk Tamam.mobileconfig manifest.plist \
              --target "${{ github.sha }}" \
              --title "Tamam تمام v1.0.0 — Site Engineer App (iOS & Android)" \
              --notes "Pre-production build of Tamam (تمام) Site Engineer Field Accounting App for iOS (.mobileconfig & unsigned .ipa) and Android (.apk)." \
              --latest \
              -R "${{ github.repository }}"
          fi
